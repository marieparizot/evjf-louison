<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad1457"/><stop offset=".6" stop-color="#ec407a"/><stop offset="1" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffd54f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- bulles -->
  <g fill="#fff" opacity=".85">
    <circle cx="256" cy="92" r="10"/><circle cx="228" cy="124" r="6"/><circle cx="286" cy="128" r="7"/><circle cx="256" cy="150" r="4"/>
  </g>
  <!-- coupe gauche -->
  <g transform="rotate(14 200 300)">
    <path d="M150 190 h100 l-10 70 a40 40 0 0 1 -80 0 z" fill="url(#gl)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M200 300 v90" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M165 398 h70" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- coupe droite -->
  <g transform="rotate(-14 312 300)">
    <path d="M262 190 h100 l-10 70 a40 40 0 0 1 -80 0 z" fill="url(#gl)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M312 300 v90" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M277 398 h70" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- étincelle -->
  <path d="M256 150 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z" fill="#fff"/>
  <!-- bague -->
  <g transform="translate(256 448)">
    <circle r="26" fill="none" stroke="#ffd54f" stroke-width="9"/>
    <path d="M-12 -30 l12 -16 12 16 -12 10 z" fill="#e1f5fe" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
